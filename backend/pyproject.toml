[project]
name = "backend"
version = "0.1.0"
description = "Codekids Backend service"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]>=0.120.4",
    "minio>=7.2.18",
    "openai>=2.6.1",
    "prisma>=0.15.0",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.ruff.lint.per-file-ignores]
# Route handlers deliberately catch Exception so an unexpected failure becomes
# an HTTP error response (or an empty result) instead of an unhandled 500.
"src/routers/*" = ["BLE001"]
